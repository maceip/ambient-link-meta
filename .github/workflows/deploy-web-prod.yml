# Automatic production deploy: every push to main updates the server git checkout.
# Caddy serves /home/devuser/ambient-link-meta/web at https://agent.public.computer/
# — no rsync, no local deploy script.
name: Deploy web (production)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-web-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Pull latest main on server
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          host="${PROD_SSH_HOST:?PROD_SSH_HOST secret is required}"
          user="${PROD_SSH_USER:?PROD_SSH_USER secret is required}"
          port="${PROD_SSH_PORT:-22}"
          repo=/home/devuser/ambient-link-meta

          ssh -o StrictHostKeyChecking=accept-new -p "$port" "${user}@${host}" \
            "bash -lc 'cd ${repo} && git fetch origin && git checkout main && git reset --hard origin/main && git log -1 --oneline'"

      - name: Verify deploy on server
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          host="${PROD_SSH_HOST:?PROD_SSH_HOST secret is required}"
          user="${PROD_SSH_USER:?PROD_SSH_USER secret is required}"
          port="${PROD_SSH_PORT:-22}"
          repo=/home/devuser/ambient-link-meta

          # Verify the deployed checkout IS the pushed commit — no hardcoded
          # content markers (a v61 grep here kept failing every deploy after
          # the SW version moved on).
          deployed=$(ssh -o StrictHostKeyChecking=accept-new -p "$port" "${user}@${host}" \
            "git -C ${repo} rev-parse HEAD" | tail -1 | tr -d '[:space:]')
          if [ "$deployed" != "${GITHUB_SHA}" ]; then
            echo "deployed HEAD $deployed != pushed ${GITHUB_SHA}" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --max-time 20 \
            https://agent.public.computer/ -o /tmp/ambient-link-index.html
          grep -q "var BUILD = '" /tmp/ambient-link-index.html
          curl --fail --silent --show-error --max-time 20 \
            https://agent.public.computer/ambient-link/status -o /tmp/ambient-link-status.json
          echo "production web deploy verified on server: $deployed"
