# Hermetic end-to-end test of the glasses web app against the REAL pipeline:
# the production relay binary (built from ambient-link-core), a fake "claude"
# agent honoring Claude Code's observable contract, and the shipping web UI
# driven by Playwright. No mocks. See web/test/e2e-live.spec.mjs.
#
# The web app is a Svelte 5 build: source in web-next/, committed output in
# web/ (Caddy serves that directory as-is — see DEPLOYMENT.md). This workflow
# runs the web-next unit tests, rebuilds, FAILS if the rebuild differs from
# the committed output (production ships the committed files, so drift means
# someone forgot `npm run build`), then runs Playwright against web/.
#
# This suite is the regression gate for the class of bugs that previously
# shipped silently: a blank web app (a bad export of a deleted function),
# delivery that said "delivered" but never landed (tmux locale sanitization),
# and empty chat previews (raw JSONL payloads).
name: web-e2e

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "web-next/**"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    paths:
      - "web/**"
      - "web-next/**"
      - ".github/workflows/web-e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout ambient-link-meta
        uses: actions/checkout@v4

      - name: Checkout ambient-link-core (relay source)
        uses: actions/checkout@v4
        with:
          repository: maceip/ambient-link-core
          path: ambient-link-core

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ambient-link-core/host/go.mod
          cache-dependency-path: ambient-link-core/host/go.sum

      - name: Build relay binary
        run: |
          cd ambient-link-core/host
          go build -o bin/ambient-link-host ./cmd/host

      - name: Set up Node (>=22 for global WebSocket in the spec)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web-next/package-lock.json

      - name: Install tmux + lsof (delivery + proc correlation)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux lsof

      - name: Install web-next deps
        run: cd web-next && npm ci

      - name: Unit tests (store, protocol, delivery, ws)
        run: cd web-next && npm test

      - name: Rebuild and verify committed output is current
        run: |
          cd web-next && npm run build
          if ! git diff --exit-code -- ../web; then
            echo "::error::web/ is stale — run 'npm run build' in web-next/ and commit the output" >&2
            exit 1
          fi

      - name: Install web test deps
        run: cd web && npm ci

      - name: Install Playwright chromium
        run: cd web && npx playwright install --with-deps chromium

      - name: Run E2E suite
        env:
          AMBIENT_HOST_BIN: ${{ github.workspace }}/ambient-link-core/host/bin/ambient-link-host
        run: cd web && npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
