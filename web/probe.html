<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="theme-color" content="#0B141A">
  <title>ambient transport probe</title>
  <style>
    :root { --bg:#0B141A; --surface:#111B21; --text:#E9EDEF; --muted:#8696A0;
      --ok:#00A884; --bad:#E57373; --warn:#E0A800; --info:#53BDEB; }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
      font: 13px/1.35 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    h1 { font-size:14px; margin: 8px 12px 2px; }
    .sub { color:var(--muted); margin: 0 12px 8px; font-size:11px; }
    .row { display:flex; gap:8px; padding: 4px 12px; flex-wrap:wrap; }
    button { background: var(--ok); color:#fff; border:0; border-radius:18px; padding:8px 14px;
      font-size:12px; font-weight:600; cursor:pointer; }
    button.alt { background:#2A3942; }
    #summary { margin: 6px 12px; display:grid; grid-template-columns: auto 1fr; gap:2px 10px; font-size:12px; }
    #summary .k { color:var(--muted); }
    #summary .pass { color:var(--ok); }
    #summary .fail { color:var(--bad); }
    #summary .blocked { color:var(--warn); }
    #summary .skip { color:var(--muted); }
    #summary .run { color:var(--info); }
    pre#log { margin: 8px 12px; padding:8px; background:var(--surface); border-radius:6px;
      max-height: 46vh; overflow-y:auto; font: 11px/1.35 ui-monospace, Menlo, monospace;
      white-space: pre-wrap; word-break: break-all; }
    .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
    .dim{color:var(--muted)} .info{color:var(--info)}
  </style>
</head>
<body>
  <h1>ambient transport probe</h1>
  <p class="sub">One pass: tests every local + fallback transport and reports what this runtime actually allows. Override targets with <code>?lan=IP:PORT&amp;phone=HOST&amp;turn=turn:HOST:3478&amp;turnuser=U&amp;turnpass=P</code>.</p>

  <div class="row">
    <button id="run">run all</button>
    <button id="copy" class="alt">copy log</button>
    <button id="clear" class="alt">clear</button>
  </div>

  <div id="summary"></div>
  <pre id="log"></pre>

  <script src="probe.js"></script>
</body>
</html>
