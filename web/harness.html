<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUD button harness</title>
<link rel="stylesheet" href="styles.css?v=22">
<link rel="stylesheet" href="blocks/blocks.css?v=22">
<link rel="stylesheet" href="companion.css?v=22">
<style>
  body { margin: 0; background: #000; color: #fff; min-height: 100vh; }
  .stage { padding: 24px; display: flex; flex-direction: column; gap: 28px; max-width: 560px; margin: 0 auto; }
  .cap { font: 12px/1.4 var(--font-sans, sans-serif); opacity: .55; letter-spacing: .04em; text-transform: uppercase; }
  .hint { font-size: 14px; opacity: .7; line-height: 1.45; }
</style>
</head>
<body>
  <div class="stage">
    <p class="hint">Tap or D-pad focus — one pill expands, icon stays left, label grows right (475ms / 625ms). Matches BUTTON_ANIMS.mov.</p>

    <div class="cap">messages HUD — five circles in one cluster</div>
    <div class="button-row">
      <div class="rbtn-row">
        <button type="button" class="rbtn focusable"><span class="rbtn-pill"><span class="rbtn-icon">📞</span><span class="rbtn-label">Call</span></span></button>
        <button type="button" class="rbtn focusable"><span class="rbtn-pill"><span class="rbtn-icon">🎙</span><span class="rbtn-label">Dictate</span></span></button>
        <button type="button" class="rbtn focusable"><span class="rbtn-pill"><span class="rbtn-icon">🖼</span><span class="rbtn-label">Gallery</span></span></button>
        <button type="button" class="rbtn focusable"><span class="rbtn-pill"><span class="rbtn-icon">📷</span><span class="rbtn-label">Camera</span></span></button>
      </div>
    </div>

    <div class="cap">agent shelf</div>
    <nav class="shelf">
      <div class="rbtn-row">
        <button type="button" class="rbtn focusable"><span class="rbtn-pill"><span class="rbtn-icon">◆</span><span class="rbtn-label">Cursor</span></span></button>
        <button type="button" class="rbtn focusable"><span class="rbtn-pill"><span class="rbtn-icon">✳</span><span class="rbtn-label">Claude</span></span></button>
        <button type="button" class="rbtn focusable"><span class="rbtn-pill"><span class="rbtn-icon">▶</span><span class="rbtn-label">Codex</span></span></button>
      </div>
    </nav>

    <div class="cap">new session — dictate + start grouped</div>
    <nav class="new-actions">
      <div class="rbtn-row">
        <button type="button" class="rbtn focusable"><span class="rbtn-pill"><span class="rbtn-icon">🎙</span><span class="rbtn-label">Dictate</span></span></button>
        <button type="button" class="rbtn focusable rbtn-primary"><span class="rbtn-pill"><span class="rbtn-icon">▶</span><span class="rbtn-label">Start</span></span></button>
      </div>
    </nav>
  </div>
<script>
(function () {
  document.querySelectorAll('.rbtn-row').forEach(function (group) {
    var btns = group.querySelectorAll('.rbtn');
    function setActive(active) {
      btns.forEach(function (b) { b.classList.toggle('rbtn-active', b === active); });
    }
    btns.forEach(function (btn) {
      btn.addEventListener('focus', function () { setActive(btn); });
      btn.addEventListener('blur', function () {
        requestAnimationFrame(function () {
          if (!group.contains(document.activeElement)) setActive(null);
        });
      });
    });
  });
})();
</script>
</body>
</html>
