<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambient blocks demo</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="blocks.css">
<style>
  body { margin: 0; background: #000; color: #fff; }
  .demo-nav {
    display: flex; gap: 8px; justify-content: center; padding: 16px;
    border-bottom: 1px solid var(--stroke);
  }
  .demo-nav button {
    border: 1px solid var(--stroke); background: var(--bg-tertiary);
    color: var(--text-primary); border-radius: var(--radius-pill);
    padding: 8px 16px; cursor: pointer; font: inherit;
  }
  .demo-nav button.active {
    border-color: var(--focus-ring);
    background: var(--bg-card);
  }
  .demo-stage {
    width: min(100vw, 600px); height: min(100vh, 600px);
    margin: 0 auto; position: relative; border: 1px solid var(--stroke);
  }
  .demo-pane { position: absolute; inset: 0; }
  .demo-pane.hidden { display: none; }
  .cap { padding: 8px 20px 0; font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
<nav class="demo-nav" aria-label="block picker">
  <button type="button" data-pane="shelf" class="active">shelf_list_view</button>
  <button type="button" data-pane="form">form</button>
  <button type="button" data-pane="agent">agent_action_card</button>
</nav>

<div class="demo-stage">
  <!-- 1. shelf_list_view -->
  <section id="pane-shelf" class="demo-pane blk-shelf-list-view">
    <header class="blk-shelf-list-view__hdr">
      <span class="blk-shelf-list-view__title">sessions</span>
    </header>
    <div id="demo-list" class="blk-shelf-list-view__list" role="list"></div>
    <nav class="blk-shelf-list-view__shelf" role="toolbar" aria-label="new session">
      <div id="demo-shelf-btns"></div>
    </nav>
  </section>

  <!-- 2. form -->
  <section id="pane-form" class="demo-pane blk-form-view hidden">
    <header class="blk-form-view__hdr">
      <div class="blk-form-view__title-wrap">
        <span class="blk-form-view__icon agent-cursor">◆</span>
        <h1 class="blk-form-view__title">createCursor</h1>
      </div>
    </header>
    <div id="demo-form-body" class="blk-form-view__body"></div>
    <nav class="blk-form-view__actions" role="toolbar" aria-label="create session">
      <div id="demo-form-actions"></div>
    </nav>
  </section>

  <!-- 3. agent_action_card -->
  <section id="pane-agent" class="demo-pane hidden" style="display:flex;flex-direction:column;height:100%;background:#000;">
    <p class="cap">Tap Dictate → listening card. Done card auto-countdown on Continue.</p>
    <div class="blk-agent-view" style="flex:1;">
      <p id="demo-meta" class="blk-agent-card__meta">demo · done</p>
      <div id="demo-body" class="blk-agent-card__body">Shipped the auth fix. Ready to merge?</div>
      <div id="demo-chips" class="blk-agent-card__actions"></div>
    </div>
  </section>
</div>

<script src="blocks.js"></script>
<script>
(function () {
  var AB = window.AmbientBlocks;
  var agentBody = 'Shipped the auth fix. Ready to merge?';

  /* shelf */
  var list = document.getElementById('demo-list');
  ['ambient-link', 'facechat-hud', 'relay-bridge'].forEach(function (name, i) {
    list.appendChild(AB.renderListItem({
      label: name,
      preview: i === 2 ? 'question — needs input' : 'done — continue or dictate',
      time: (i + 1) + 'm',
      avatarHtml: '◆',
      avatarClass: 'agent-cursor',
      badge: i === 2 ? 'question' : 'done',
      badgeClass: 'status-tag ' + (i === 2 ? 'question' : 'done'),
    }));
  });
  document.getElementById('demo-shelf-btns').appendChild(AB.renderRbtnRow([
    { label: 'Cursor', icon: '◆' },
    { label: 'Claude', icon: '✳' },
    { label: 'Codex', icon: '▶' },
  ]));

  /* form */
  var formBody = document.getElementById('demo-form-body');
  formBody.appendChild(AB.renderFormField({
    id: 'demo-cwd', label: 'working directory', placeholder: '/Users/you/project',
  }));
  formBody.appendChild(AB.renderFormField({
    id: 'demo-prompt', label: 'prompt', type: 'textarea', placeholder: 'what should the agent do?',
  }));
  document.getElementById('demo-form-actions').appendChild(AB.renderRbtnRow([
    { label: 'Dictate', iconHtml: AB.MIC_SVG },
    { label: 'Start', icon: '▶', primary: true },
  ]));

  /* agent */
  var bodyEl = document.getElementById('demo-body');
  var chipsEl = document.getElementById('demo-chips');
  var cancelCountdown = null;
  function mountChips(listening) {
    if (cancelCountdown) { cancelCountdown(); cancelCountdown = null; }
    chipsEl.innerHTML = '';
    cancelCountdown = AB.renderAgentActions(chipsEl, [
      { label: 'continue', text: 'continue', kind: 'send', style: 'primary' },
      { label: 'dictate', kind: 'dictate', style: 'primary' },
    ], {
      onDictate: function () {
        if (cancelCountdown) cancelCountdown();
        AB.showListeningCard(bodyEl, agentBody, '');
        mountChips(true);
      },
      onSend: function () {
        if (cancelCountdown) cancelCountdown();
        AB.clearListeningCard(bodyEl, agentBody);
        bodyEl.textContent = 'Continuing…';
        chipsEl.innerHTML = '';
      },
    }, listening ? null : {
      enabled: true,
      baseLabel: 'continue',
      onComplete: function () {
        bodyEl.textContent = 'Auto-continued after 5s';
        chipsEl.innerHTML = '';
      },
    });
    if (listening) {
      var cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'blk-action-chip chip focusable chip-outline';
      cancel.textContent = 'cancel';
      cancel.addEventListener('click', function () {
        AB.clearListeningCard(bodyEl, agentBody);
        mountChips(false);
      });
      chipsEl.appendChild(cancel);
    }
  }
  mountChips(false);

  AB.wireRbtnGroups(document);

  document.querySelectorAll('.demo-nav button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.demo-nav button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var pane = btn.getAttribute('data-pane');
      document.querySelectorAll('.demo-pane').forEach(function (p) {
        p.classList.toggle('hidden', p.id !== 'pane-' + pane);
      });
    });
  });
})();
</script>
</body>
</html>
