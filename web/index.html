<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Ambient Link — agent sessions on Meta Display glasses.">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>ambient link</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=28">
  <link rel="stylesheet" href="blocks/blocks.css?v=28">
  <link rel="stylesheet" href="companion.css?v=28">
  <link rel="manifest" href="manifest.json">
  <script>
    (function () {
      var BUILD = 'v28';
      if (!('serviceWorker' in navigator)) return;
      window.addEventListener('load', function () {
        // Self-heal: earlier installs left a stale service worker caching an old
        // shell. Drop any cache that isn't this build before (re)registering.
        try {
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) {
                if (k.indexOf('ambient-link-meta-') === 0 && k !== 'ambient-link-meta-' + BUILD) {
                  caches.delete(k);
                }
              });
            });
          }
        } catch (e) {}
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          reg.update();
        }).catch(function () {});
      });
    })();
  </script>
</head>
<body>
<div id="app">

  <!-- THREAD LIST — blk-shelf-list_view -->
  <section id="view-threads" class="view blk-shelf-list-view">
    <header class="list-hdr blk-shelf-list-view__hdr">
      <span class="list-title blk-shelf-list-view__title">sessions</span>
      <span id="conn-dot" class="conn-dot off" title="relay connection" aria-label="relay connection"></span>
    </header>
    <span id="relay-badge" class="relay-badge hidden" title="relay debug — auto cards suppressed">debug</span>
    <div id="host-panel" class="host-panel hidden" aria-live="polite"></div>
    <p id="empty-hint" class="empty-hint blk-shelf-list-view__empty">no sessions</p>
    <div id="threads" class="thread-list blk-shelf-list-view__list" role="list"></div>
    <nav id="shelf" class="shelf blk-shelf-list-view__shelf" role="toolbar" aria-label="new session">
      <div class="rbtn-row blk-rbtn-row">
      <button type="button" class="rbtn focusable agent-launcher" data-agent="cursor" title="new cursor session" aria-label="new cursor session">
        <span class="rbtn-pill"><span class="rbtn-icon" data-agent-icon="cursor"></span><span class="rbtn-label">Cursor</span></span>
      </button>
      <button type="button" class="rbtn focusable agent-launcher" data-agent="claude" title="new claude session" aria-label="new claude session">
        <span class="rbtn-pill"><span class="rbtn-icon" data-agent-icon="claude"></span><span class="rbtn-label">Claude</span></span>
      </button>
      <button type="button" class="rbtn focusable agent-launcher" data-agent="codex" title="new codex session" aria-label="new codex session">
        <span class="rbtn-pill"><span class="rbtn-icon" data-agent-icon="codex"></span><span class="rbtn-label">Codex</span></span>
      </button>
      </div>
    </nav>
  </section>

  <!-- SESSION COMPOSE -->
  <section id="view-thread" class="view hidden blk-agent-screen">
    <header class="thread-hdr">
      <span id="t-title" class="title hdr-title">session</span>
    </header>
    <div class="compose-wrap blk-agent-view">
      <p id="w-meta" class="widget-meta blk-agent-card__meta"></p>
      <div id="w-card" class="widget-card hud-card blk-agent-card__body"></div>
      <div id="w-chips" class="widget-chips blk-agent-card__actions" role="group" aria-label="quick actions"></div>
    </div>
    <div class="compose-field">
      <input id="prompt" type="text" placeholder="type your message…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="text-input focusable">
    </div>
    <nav id="thread-actions" class="thread-actions new-actions blk-form-view__actions" role="toolbar" aria-label="session actions">
      <div class="rbtn-row blk-rbtn-row">
        <button type="button" id="back" class="rbtn focusable" aria-label="back">
          <span class="rbtn-pill"><span class="rbtn-icon" aria-hidden="true">‹</span><span class="rbtn-label">Back</span></span>
        </button>
        <button type="button" id="dictate" class="rbtn focusable" title="dictate" aria-label="dictate">
          <span class="rbtn-pill">
            <span class="rbtn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </span>
            <span class="rbtn-label">Dictate</span>
          </span>
        </button>
        <button type="button" id="send" class="rbtn rbtn-primary focusable" title="send" aria-label="send">
          <span class="rbtn-pill"><span class="rbtn-icon" aria-hidden="true">↑</span><span class="rbtn-label">Send</span></span>
        </button>
      </div>
    </nav>
  </section>

  <!-- NEW SESSION — blk-form -->
  <section id="view-new" class="view hidden blk-form-view">
    <header class="hdr new-hdr blk-form-view__hdr">
      <div class="new-title-wrap blk-form-view__title-wrap">
        <span id="new-title-icon" class="new-title-icon blk-form-view__icon agent-cursor" data-agent-icon="cursor" aria-hidden="true"></span>
        <h1 id="new-title" class="new-title-text blk-form-view__title">createCursor</h1>
      </div>
    </header>
    <div class="new-body blk-form-view__body">
      <label class="field-label" for="new-cwd">working directory</label>
      <input id="new-cwd" class="text-input focusable" type="text" placeholder="/path/to/project">
      <label class="field-label" for="new-prompt">prompt</label>
      <textarea id="new-prompt" class="text-input focusable" rows="5" placeholder="what should the agent do?"></textarea>
    </div>
    <nav class="new-actions blk-form-view__actions" role="toolbar" aria-label="create session">
      <div class="rbtn-row blk-rbtn-row">
      <button type="button" id="new-dictate" class="rbtn focusable" title="dictate" aria-label="dictate">
        <span class="rbtn-pill">
          <span class="rbtn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
          </span>
          <span class="rbtn-label">Dictate</span>
        </span>
      </button>
      <button type="button" id="new-start" class="rbtn focusable rbtn-primary" aria-label="start session">
        <span class="rbtn-pill">
          <span class="rbtn-icon" aria-hidden="true">▶</span>
          <span class="rbtn-label">Start</span>
        </span>
      </button>
      </div>
    </nav>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script src="chipset.js?v=28"></script>
<script src="blocks/blocks.js?v=28"></script>
<script src="app.js?v=28"></script>
</body>
</html>
