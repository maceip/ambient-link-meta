  <!-- SESSION COMPOSE (laptop / phone browser — type long prompts here) -->
  <section id="view-thread" class="view hidden">
    <header class="hdr">
      <button type="button" id="back" class="iconbtn focusable" aria-label="back">‹</button>
      <span id="t-title" class="title hdr-title">session</span>
    </header>
    <div class="compose-wrap">
      <p id="w-meta" class="widget-meta"></p>
      <div id="w-card" class="widget-card"></div>
    </div>
    <form id="composer" class="composer">
      <button type="button" id="dictate" class="dictate-btn focusable" title="dictate" aria-label="dictate">🎙</button>
      <input id="prompt" type="text" placeholder="type your message…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="focusable">
      <button type="submit" id="send" class="send-btn focusable" title="send">↑</button>
    </form>
  </section>
