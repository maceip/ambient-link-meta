<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Ambient Link — agent sessions on Meta Display glasses.">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>ambient link</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.json">
  <script>
    (function () {
      // BUILD marker: deploy verification greps for it, humans read it in
      // view-source. The real freshness key is the hashed asset URLs.
      var BUILD = 'svelte-2-wake-stack';
      if (!('serviceWorker' in navigator)) return;
      // Only reload when an UPDATED worker takes over a page that was already
      // controlled. On first install (claim() fires controllerchange too) the
      // page is already the freshest build — reloading during the window where
      // the new cache may not be populated is how the glasses browser lands on
      // its dead-end "No Internet Connection" page.
      var hadController = !!navigator.serviceWorker.controller;
      var reloadedForSw = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController) { hadController = true; return; }
        if (reloadedForSw) return;
        reloadedForSw = true;
        location.reload();
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          reg.update();
        }).catch(function () {});
      });
    })();
  </script>
  <script type="module" crossorigin src="./assets/index-o-ZKQR2b.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/style-CZjavvXe.css">
</head>

</body>
